name: RealWorld Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "production" ]
  pull_request:
    branches: [ "main", "production" ]

jobs:
  # ==========================================
  # 1️⃣ Linting & Code Testing Phase
  # ==========================================
  lint-and-test:
    name: 1. Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Run Flake8 Lint + Django Tests
        env:
          DEBUG: '1'
        run: |
          cd backend
          python -m pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir flake8
          if [ -f requirements.txt ]; then pip install --no-cache-dir -r requirements.txt; fi
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          python manage.py test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies & Run Frontend Tests
        run: |
          cd frontend
          npm install
          CI=true npm test

  # ==========================================
  # 2️⃣ Terraform Infrastructure Validation Phase
  # ==========================================
  terraform-validate:
    name: 2. Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.2"

      - name: Terraform Format Check & Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

  # ==========================================
  # 3️⃣ Ansible Syntax & Lint Check Phase
  # ==========================================
  ansible-check:
    name: 3. Ansible Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python & Ansible
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible & Run Syntax Check
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir ansible
          cd ansible
          ansible-playbook -i hosts.example.ini setup-server.yml --syntax-check
          ansible-playbook -i hosts.example.ini playbook.yml --syntax-check
          ansible-playbook -i hosts.example.ini monitoring.yml --syntax-check

  # ==========================================
  # 4️⃣ Docker Build & Image Push Phase
  # ==========================================
  docker-build:
    name: 4. Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint-and-test, terraform-validate, ansible-check]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build -t local/realworld-backend:${{ github.sha }} ./backend

      - name: Build Frontend Image
        run: |
          docker build -t local/realworld-frontend:${{ github.sha }} ./frontend

      - name: Log in & Push Images to Docker Hub
        if: github.event_name != 'pull_request'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker tag local/realworld-backend:${{ github.sha }} $DOCKER_USERNAME/realworld-backend:${{ github.sha }}
            docker tag local/realworld-backend:${{ github.sha }} $DOCKER_USERNAME/realworld-backend:latest
            docker push $DOCKER_USERNAME/realworld-backend:${{ github.sha }}
            docker push $DOCKER_USERNAME/realworld-backend:latest

            docker tag local/realworld-frontend:${{ github.sha }} $DOCKER_USERNAME/realworld-frontend:${{ github.sha }}
            docker tag local/realworld-frontend:${{ github.sha }} $DOCKER_USERNAME/realworld-frontend:latest
            docker push $DOCKER_USERNAME/realworld-frontend:${{ github.sha }}
            docker push $DOCKER_USERNAME/realworld-frontend:latest
          else
            echo "DOCKER_USERNAME or DOCKER_PASSWORD secret not set in GitHub Repository Secrets. Skipping Docker Hub push."
          fi

  # ==========================================
  # 5️⃣ Trivy Vulnerability Scan Phase
  # ==========================================
  trivy-scan:
    name: 5. Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Backend Image locally for Scan
        run: docker build -t local/realworld-backend:scan ./backend

      - name: Run Trivy vulnerability scanner on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local/realworld-backend:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build Frontend Image locally for Scan
        run: docker build -t local/realworld-frontend:scan ./frontend

      - name: Run Trivy vulnerability scanner on Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local/realworld-frontend:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # 6️⃣ Automated Deployment via Ansible Phase
  # ==========================================
  deploy:
    name: 6. Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [docker-build, trivy-scan]
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Ansible Deployment Playbook
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$AWS_SSH_PRIVATE_KEY" ]; then
            echo "EC2_HOST or AWS_SSH_PRIVATE_KEY secret not set in GitHub Repository Secrets. Skipping EC2 deployment."
            exit 0
          fi
          
          mkdir -p ~/.ssh
          eval $(ssh-agent -s)
          echo "$AWS_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts || true
          
          cd ansible
          echo "[webservers]" > hosts.ini
          echo "$EC2_HOST ansible_user=ubuntu" >> hosts.ini
          
          sudo apt-get update && sudo apt-get install -y ansible
          
          ansible-playbook -i hosts.ini playbook.yml -v \
            -e postgres_password="${POSTGRES_PASSWORD:-change_me}" \
            -e django_secret_key="${DJANGO_SECRET_KEY:-change_me}" \
            -e django_superuser_password="${DJANGO_SUPERUSER_PASSWORD:-change_me}" \
            -e docker_username="${DOCKER_USERNAME:-mahmoodahmed11}" \
            -e image_tag="${{ github.sha }}"