- name: Deploy Monitoring Stack (Prometheus & Grafana)
  hosts: webservers
  become: yes
  vars_files:
    - vars.example.yml
    - [ "vars/vault.yml", "vars/vault.example.yml" ]
  vars:
    monitoring_dir: /home/ubuntu/monitoring
  tasks:
    - name: Create monitoring directory structure
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
      loop:
        - "{{ monitoring_dir }}"
        - "{{ monitoring_dir }}/prometheus"

    - name: Copy Prometheus configuration file
      copy:
        src: ./prometheus.yml
        dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
        owner: ubuntu
        group: ubuntu

    - name: Copy Docker Compose file for monitoring
      copy:
        content: |
          version: '3.8'
          networks:
            monitoring:
              driver: bridge
          volumes:
            prometheus_data:
            grafana_data:
          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: prometheus
              restart: unless-stopped
              volumes:
                - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
                - prometheus_data:/prometheus
              command:
                - "--config.file=/etc/prometheus/prometheus.yml"
                - "--storage.tsdb.path=/prometheus"
              ports:
                - "127.0.0.1:9090:9090"
              networks:
                - monitoring

            node-exporter:
              image: prom/node-exporter:latest
              container_name: node-exporter
              restart: unless-stopped
              volumes:
                - /proc:/host/proc:ro
                - /sys:/host/sys:ro
                - /:/rootfs:ro
              command:
                - "--path.procfs=/host/proc"
                - "--path.rootfs=/rootfs"
                - "--path.sysfs=/host/sys"
                - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
              ports:
                - "127.0.0.1:9100:9100"
              networks:
                - monitoring

            grafana:
              image: grafana/grafana:latest
              container_name: grafana
              restart: unless-stopped
              environment:
                - GF_SECURITY_ADMIN_USER={{ grafana_admin_user | default('admin') }}
                - GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password | default(vault_grafana_admin_password) }}
              ports:
                - "127.0.0.1:3000:3000"
              volumes:
                - grafana_data:/var/lib/grafana
              networks:
                - monitoring
        dest: "{{ monitoring_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu



    - name: Clean up unused Docker images and build cache
      shell: docker system prune -af --volumes || true

    - name: Start Prometheus and Grafana containers
      shell: docker compose up -d
      args:
        chdir: "{{ monitoring_dir }}"
