- name: Deploy Monitoring Stack (Prometheus & Grafana)
  hosts: webservers
  become: yes
  vars:
    monitoring_dir: /home/ubuntu/monitoring
  tasks:
    - name: Create monitoring directory structure
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
      loop:
        - "{{ monitoring_dir }}"
        - "{{ monitoring_dir }}/prometheus"

    - name: Copy Prometheus configuration file
      copy:
        content: |
          global:
            scrape_interval: 15s
          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']
        dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
        owner: ubuntu
        group: ubuntu

    - name: Copy Docker Compose file for monitoring
      copy:
        content: |
          version: '3.8'
          networks:
            monitoring:
              driver: bridge
          volumes:
            prometheus_data:
            grafana_data:
          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: prometheus
              restart: unless-stopped
              volumes:
                - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
                - prometheus_data:/prometheus
              ports:
                - "9090:9090"
              networks:
                - monitoring
            grafana:
              image: grafana/grafana:latest
              container_name: grafana
              restart: unless-stopped
              ports:
                - "3000:3000"
              volumes:
                - grafana_data:/var/lib/grafana
              networks:
                - monitoring
        dest: "{{ monitoring_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu

    - name: Start Prometheus and Grafana containers
      shell: docker compose up -d
      args:
        chdir: "{{ monitoring_dir }}"
