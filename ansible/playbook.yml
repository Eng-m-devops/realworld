- name: Deploy RealWorld Application
  hosts: webservers
  become: yes
  vars:
    app_dir: /home/ubuntu/app

  tasks:
    - name: Clean up unused Docker cache and apt cache to free disk space
      shell: |
        docker system prune -f || true
        apt-get clean || true
      ignore_errors: yes

    - name: Create Swap Space (2GB) to prevent OOM
      shell: |
        if [ ! -f /swapfile ]; then
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
        fi
      args:
        creates: /swapfile

    # -----------------------------------------------
    # 1. إيقاف الحاويات القديمة لتحرير المنفذ 80 لـ Nginx الرئيسي
    # -----------------------------------------------
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Copy docker-compose.yml to server
      copy:
        src: ./docker-compose.Prod.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Copy prometheus.yml to server
      copy:
        src: ./prometheus.yml
        dest: "{{ app_dir }}/prometheus.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Stop old docker containers to release port 80
      shell: |
        docker compose down --remove-orphans || true
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: yes

    # -----------------------------------------------
    # 2. تثبيت وضبط Nginx على السيرفر الرئيسي
    # -----------------------------------------------
    - name: Install Nginx web server and Certbot
      apt:
        name:
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: yes

    - name: Copy Nginx site configuration to host
      copy:
        src: ./nginx-host.conf
        dest: /etc/nginx/sites-available/default
        owner: root
        group: root
        mode: "0644"

    - name: Ensure Nginx service is running and enabled
      service:
        name: nginx
        state: restarted
        enabled: yes

    # -----------------------------------------------
    # 3. إنشاء البيئة وتشغيل الحاويات الجديدة
    # -----------------------------------------------
    - name: Generate .env file on server with dynamic environment variables
      copy:
        content: |
          POSTGRES_DB={{ postgres_db | default('conduit') }}
          POSTGRES_USER={{ postgres_user | default('postgres_user') }}
          POSTGRES_PASSWORD={{ postgres_password | default('AdminPass12345') }}
          POSTGRES_PORT=5432
          DB_HOST=db
          PYTHONUNBUFFERED=1
          SECRET_KEY={{ django_secret_key | default('awIQPp_oykheM90AKM-fS4jm_-rPJGx1DCOWrSK8YkeyU67FJvyKLB6LGzpjMj2XoKU') }}
          DEBUG=0
          ALLOWED_HOSTS=*
          DATABASE_URL=postgres://{{ postgres_user | default('postgres_user') }}:{{ postgres_password | default('AdminPass12345') }}@db:5432/{{ postgres_db | default('conduit') }}
          DJANGO_SUPERUSER_USERNAME={{ django_superuser_username | default('admin') }}
          DJANGO_SUPERUSER_EMAIL={{ django_superuser_email | default('admin@example.com') }}
          DJANGO_SUPERUSER_PASSWORD={{ django_superuser_password | default('admin12345') }}
          DOCKER_USERNAME={{ docker_username | default('mahmoodahmed11') }}
          IMAGE_TAG={{ image_tag | default('latest') }}
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Pull latest docker images and restart containers
      shell: |
        docker compose pull && docker compose up -d
      args:
        chdir: "{{ app_dir }}"
