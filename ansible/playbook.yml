- name: Deploy RealWorld Application
  hosts: webservers
  become: yes
  vars:
    app_dir: /home/ubuntu/app

  tasks:
    # -----------------------------------------------
    # 1. تثبيت وضبط Nginx على السيرفر الرئيسي
    # -----------------------------------------------
    - name: Install Nginx web server and Certbot
      apt:
        name:
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: yes

    - name: Ensure Nginx service is running and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Copy Nginx site configuration to host
      copy:
        src: ./nginx-host.conf
        dest: /etc/nginx/sites-available/default
        owner: root
        group: root
        mode: "0644"

    - name: Reload Nginx to apply changes
      service:
        name: nginx
        state: reloaded

    # -----------------------------------------------
    # 2. إعداد مجلد التطبيق وتشغيل الحاويات
    # -----------------------------------------------
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Copy docker-compose.yml to server
      copy:
        src: ./docker-compose.Prod.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Create .env file on remote server from secure variables
      copy:
        content: |
          POSTGRES_PASSWORD={{ postgres_password }}
          DJANGO_SECRET_KEY={{ django_secret_key }}
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Pull latest docker images and restart containers
      shell: |
        docker compose pull && docker compose up -d
      args:
        chdir: "{{ app_dir }}"
