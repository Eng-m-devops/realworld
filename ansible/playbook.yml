- import_playbook: setup-server.yml

- name: Deploy RealWorld Application
  hosts: webservers
  become: yes
  vars_files:
    - vars.example.yml
    - [ "vars/vault.yml", "vars/vault.example.yml" ]

  tasks:
    - name: Clean up unused Docker cache and apt cache to free disk space
      shell: |
        docker system prune -f || true
        apt-get clean || true
      ignore_errors: yes

    - name: Create Swap Space (2GB) to prevent OOM
      shell: |
        if [ ! -f /swapfile ]; then
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
        fi
      args:
        creates: /swapfile

    # -----------------------------------------------
    # 1. إيقاف الحاويات القديمة لتحرير المنفذ 80 لـ Nginx الرئيسي
    # -----------------------------------------------
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Copy docker-compose.yml to server
      copy:
        src: ./docker-compose.prod.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Copy prometheus.yml to server
      copy:
        src: ./prometheus.yml
        dest: "{{ app_dir }}/prometheus.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Stop old docker containers to release port 80
      shell: |
        docker compose down --remove-orphans || true
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: yes

    # -----------------------------------------------
    # 2. تثبيت وضبط Nginx على السيرفر الرئيسي
    # -----------------------------------------------
    - name: Install Nginx web server and Certbot
      apt:
        name:
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: yes

    - name: Copy Nginx site configuration to host
      copy:
        src: ./nginx-host.conf
        dest: /etc/nginx/sites-available/default
        owner: root
        group: root
        mode: "0644"

    - name: Ensure Nginx service is running and enabled
      service:
        name: nginx
        state: restarted
        enabled: yes

    # -----------------------------------------------
    # 3. إنشاء البيئة وتشغيل الحاويات الجديدة
    # -----------------------------------------------
    - name: Generate .env file on server with dynamic environment variables
      copy:
        content: |
          POSTGRES_DB={{ postgres_db }}
          POSTGRES_USER={{ postgres_user }}
          POSTGRES_PASSWORD={{ postgres_password | default(vault_postgres_password) }}
          POSTGRES_PORT=5432
          DB_HOST={{ db_host }}
          PYTHONUNBUFFERED=1
          SECRET_KEY={{ django_secret_key | default(vault_django_secret_key) }}
          DEBUG={{ django_debug }}
          ALLOWED_HOSTS={{ django_allowed_hosts }}
          DATABASE_URL=postgres://{{ postgres_user }}:{{ postgres_password | default(vault_postgres_password) }}@db:5432/{{ postgres_db }}
          DJANGO_SUPERUSER_USERNAME={{ django_superuser_username }}
          DJANGO_SUPERUSER_EMAIL={{ django_superuser_email }}
          DJANGO_SUPERUSER_PASSWORD={{ django_superuser_password | default(vault_django_superuser_password) }}
          DOCKER_USERNAME={{ docker_username }}
          IMAGE_TAG={{ image_tag }}
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Pull latest docker images and restart containers
      shell: |
        docker compose pull && docker compose up -d
      args:
        chdir: "{{ app_dir }}"

    # -----------------------------------------------
    # 4. إعداد سكريبتات والـ Cron Job للنسخ الاحتياطي لقاعدة البيانات
    # -----------------------------------------------
    - name: Copy backup and restore scripts to server
      copy:
        src: "{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        owner: ubuntu
        group: ubuntu
        mode: "0755"
      loop:
        - backup.sh
        - restore.sh

    - name: Ensure PostgreSQL backup directory exists with secure permissions
      file:
        path: /var/backups/postgres
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0750"

    - name: Set up daily automated PostgreSQL backup Cron job (runs at 2:00 AM)
      cron:
        name: "Daily PostgreSQL Database Backup"
        minute: "0"
        hour: "2"
        job: "/bin/bash {{ app_dir }}/backup.sh >> /var/log/postgres_backup.log 2>&1"
        user: ubuntu


